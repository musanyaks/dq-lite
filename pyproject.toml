[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dq-lite"
version = "0.1.0"
description = "Lightweight data quality validation framework — fast, pluggable, CI-native"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
keywords = ["data-quality", "validation", "testing", "pandas", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pandas>=1.5.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
polars = ["polars>=0.20.0"]
duckdb = ["duckdb>=0.9.0"]
spark = ["pyspark>=3.4.0"]
slack = ["requests>=2.28.0"]
all = ["dq-lite[dev,polars,duckdb,spark,slack]"]

[project.scripts]
dqlite = "dqlite.cli:app"

[project.urls]
Homepage = "https://github.com/yourname/dq-lite"
Documentation = "https://github.com/yourname/dq-lite#readme"
Repository = "https://github.com/yourname/dq-lite"
Issues = "https://github.com/yourname/dq-lite/issues"

[tool.hatch.build.targets.wheel]
packages = ["dqlite"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "C4"]
ignore = ["E501"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = "--cov=dqlite --cov-report=term-missing --cov-report=xml"
